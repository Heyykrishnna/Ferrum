[package]
name = "ferrum-phase0-dependency-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
apalis = "=1.0.0"
apalis-postgres = "=1.0.0"
axum = "=0.8.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

name: ferrum-dev
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${FERRUM_POSTGRES_USER:-ferrum}
      POSTGRES_DB: ${FERRUM_POSTGRES_DB:-ferrum}
      POSTGRES_PASSWORD: ${FERRUM_POSTGRES_PASSWORD:?set FERRUM_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FERRUM_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:

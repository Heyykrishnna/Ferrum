[workspace]
members = ["crates/config", "crates/runtime"]
exclude = ["tests/phase0/dependency-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
ferrum-config = { path = "crates/config" }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "=0.7.20"
toml = "=0.8.23"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }

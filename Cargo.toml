[workspace]
members = [
    "apps/api",
    "apps/worker",
    "crates/application",
    "crates/config",
    "crates/contracts",
    "crates/domain",
    "crates/infrastructure",
    "crates/judge",
    "crates/runtime",
    "crates/sandbox",
]
exclude = ["tests/phase0/dependency-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
apalis = "=1.0.0"
apalis-postgres = "=1.0.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
ferrum-application = { path = "crates/application" }
ferrum-config = { path = "crates/config" }
ferrum-contracts = { path = "crates/contracts" }
ferrum-domain = { path = "crates/domain" }
ferrum-infrastructure = { path = "crates/infrastructure" }
ferrum-judge = { path = "crates/judge" }
ferrum-runtime = { path = "crates/runtime" }
ferrum-sandbox = { path = "crates/sandbox" }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "macros", "migrate", "uuid", "json"] }
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "=0.7.20"
toml = "=0.8.23"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
url = "=2.5.8"
uuid = { version = "=1.29.2", features = ["v4", "v5", "serde"] }

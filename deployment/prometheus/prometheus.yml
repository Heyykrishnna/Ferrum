global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "ferrum-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: "ferrum-api"

  - job_name: "ferrum-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: "ferrum-worker"
